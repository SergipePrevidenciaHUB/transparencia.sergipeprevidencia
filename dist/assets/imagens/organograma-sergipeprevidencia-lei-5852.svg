<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1415" role="img" aria-labelledby="title desc">
<title id="title">Organograma da estrutura básica do SergipePrevidência</title>
<desc id="desc">O SergipePrevidência tem órgãos colegiados, Diretoria Executiva e órgãos de apoio e assessoramento. Os órgãos colegiados são Conselho Deliberativo, Conselho Fiscal e CIRP. A Diretoria Executiva reúne Presidência, DIFIN, DIPLAG e DIPREV. As gerências abaixo das três diretorias estão ligadas por linhas conforme a Lei 5.852 de 2006 compilada.</desc>
