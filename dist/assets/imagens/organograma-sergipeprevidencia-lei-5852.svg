.group{font-size:24px;font-weight:700}.name{font-size:20px;font-weight:700}
.detail{font-size:16px}.foot{font-size:16px;fill:#425b70}
.white{fill:#fff}.whiteSub{fill:#dcecf8}
.line{stroke:#779fbd;stroke-width:4;fill:none;stroke-linejoin:round}
.dash{stroke:#9cb4c5;stroke-width:3;stroke-dasharray:8 7;fill:none}
</style>
